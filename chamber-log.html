<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>챔버 이력 관리</title>
<style>
:root{
  --bg:#f4f5f7; --panel:#fff; --line:#d9dce3; --text:#1c1f26; --sub:#667085;
  --accent:#2457d6; --accent-weak:#e8eefc; --danger:#c62828; --ok:#1b7f4b; --chip:#eef0f4;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#15171c; --panel:#1f2229; --line:#343843; --text:#e7e9ee; --sub:#9aa3b2;
    --accent:#7aa2ff; --accent-weak:#263453; --danger:#ff7b7b; --ok:#5fd39a; --chip:#2a2e38; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 "Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px}
.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
h1{font-size:16px;margin:0 8px 0 0}
.tabs{display:flex;gap:4px}
.tabs button{border:1px solid var(--line);background:transparent;color:var(--text);padding:6px 12px;border-radius:6px;cursor:pointer;font:inherit}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.tabs .n{opacity:.8;font-size:12px;margin-left:4px}
.spacer{flex:1}
input,select,button{font:inherit;color:inherit}
input,select{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
button{cursor:pointer}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 10px}
.btn:hover{background:var(--chip)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.sm{padding:2px 8px;font-size:12px}
.btn.ok{color:var(--ok);border-color:var(--ok)}
.btn.danger{color:var(--danger)}
main{max-width:1100px;margin:0 auto;padding:16px}
.addform{display:grid;grid-template-columns:130px 90px 110px 1fr 120px 1fr auto;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:16px}
.addform input{width:100%}
.hint{grid-column:1/-1;color:var(--sub);font-size:12px}
.layer{margin-bottom:20px}
.layer-h{display:flex;align-items:center;gap:8px;margin:0 0 8px;padding-bottom:4px;border-bottom:2px solid var(--accent)}
.layer-h h2{font-size:15px;margin:0}
.layer-h .cnt{color:var(--sub);font-size:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px}
.card-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ch{font-weight:700;font-size:15px;background:var(--accent-weak);color:var(--accent);padding:1px 8px;border-radius:4px}
.wf{color:var(--sub)}
.sym{font-weight:600}
.closed-tag{font-size:12px;background:var(--chip);border-radius:4px;padding:1px 6px;color:var(--sub)}
.acts{list-style:none;margin:8px 0 0;padding:0}
.acts li{display:flex;gap:8px;align-items:baseline;padding:2px 0;border-top:1px dashed var(--line)}
.acts li.today{background:var(--accent-weak)}
.acts .d{width:64px;flex:none;color:var(--sub);font-variant-numeric:tabular-nums}
.acts .t{flex:1;word-break:break-all}
.acts .x{visibility:hidden;display:flex;gap:4px}
.acts li:hover .x{visibility:visible}
.link{border:0;background:none;color:var(--sub);padding:0 2px;font-size:12px;text-decoration:underline}
.addact{display:flex;gap:6px;margin-top:8px}
.addact input[type=text]{flex:1}
.empty{color:var(--sub);text-align:center;padding:40px 0}
.daybar{display:flex;gap:6px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.dayrow{display:flex;gap:8px;padding:6px 10px;background:var(--panel);border:1px solid var(--line);border-radius:6px;margin-bottom:4px;flex-wrap:wrap}
.dayrow .what{flex:1;min-width:200px}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--text);padding:16px;width:min(420px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog h3{margin:0 0 10px;font-size:15px}
dialog label{display:block;margin-bottom:8px;font-size:12px;color:var(--sub)}
dialog label input,dialog label select{display:block;width:100%;margin-top:2px;font-size:14px;color:var(--text)}
dialog menu{display:flex;justify-content:flex-end;gap:6px;padding:0;margin:12px 0 0}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:8px 14px;border-radius:6px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:.92}
@media (max-width:800px){ .addform{grid-template-columns:1fr 1fr} .acts .x{visibility:visible} }
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>챔버 이력 관리</h1>
    <div class="tabs" id="tabs"></div>
    <span class="spacer"></span>
    <select id="layerFilter" title="레이어 필터"></select>
    <input id="q" type="search" placeholder="검색 (챔버, 증상, 조치)" style="width:200px">
    <button class="btn" id="exportBtn" title="JSON 파일로 백업">백업</button>
    <button class="btn" id="importBtn" title="백업 파일 불러오기">불러오기</button>
    <input type="file" id="importFile" accept=".json,application/json" hidden>
  </div>
</header>
<main id="main"></main>
<datalist id="layerList"></datalist>
<dialog id="dlg"></dialog>
<div id="toast"></div>

<script>
'use strict';
const KEY = 'chamberLog.v1';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const natCmp = (a, b) => String(a).localeCompare(String(b), 'ko', {numeric: true, sensitivity: 'base'});
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => iso(new Date());
function fmtDate(s) {
  if (!s) return '';
  const [y, m, d] = s.split('-');
  return (y === String(new Date().getFullYear()) ? '' : y.slice(2) + '/') + (+m) + '/' + (+d);
}

let S = load();
let tab = 'open';
let dayDate = today();

function load() {
  try {
    const r = JSON.parse(localStorage.getItem(KEY));
    if (r && Array.isArray(r.issues)) return r;
  } catch (e) {}
  return {issues: []};
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { toast('브라우저 저장 실패 - 백업 버튼으로 파일 저장하세요'); }
  render();
}
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), 1800);
}
async function copy(text) {
  try { await navigator.clipboard.writeText(text); }
  catch (e) {
    const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); ta.remove();
  }
  toast('복사했습니다');
}

/* ---------- 데이터 헬퍼 ---------- */
const issueById = id => S.issues.find(i => i.id === id);
const sortedActs = i => [...i.actions].sort((a, b) => a.date.localeCompare(b.date));
const layers = () => [...new Set(S.issues.map(i => i.layer))].sort(natCmp);
const headLine = i => `${i.chamber} ${i.wafers ? i.wafers + '매 ' : ''}${i.symptom}`;
function issueLine(i) {
  const acts = sortedActs(i).map(a => `${fmtDate(a.date)} ${a.text}`).join(', ');
  let s = headLine(i) + (acts ? ' ' + acts : '');
  if (i.status === 'closed') s += ` → ${fmtDate(i.closedAt)} ${i.closeReason}${i.closeMemo ? ' ' + i.closeMemo : ''}`;
  return s;
}
function visibleIssues(status) {
  const q = $('#q').value.trim().toLowerCase();
  const lf = $('#layerFilter').value;
  return S.issues.filter(i => {
    if (status && i.status !== status) return false;
    if (lf && i.layer !== lf) return false;
    if (!q) return true;
    return [i.layer, i.chamber, i.wafers, i.symptom, i.closeReason, i.closeMemo, ...i.actions.map(a => a.text)]
      .join(' ').toLowerCase().includes(q);
  });
}
function groupByLayer(list) {
  const m = new Map();
  for (const i of list) { if (!m.has(i.layer)) m.set(i.layer, []); m.get(i.layer).push(i); }
  return [...m.entries()].sort((a, b) => natCmp(a[0], b[0]));
}

/* ---------- 입력 대화상자 ---------- */
function ask(title, fields, okLabel = '저장') {
  return new Promise(res => {
    const dlg = $('#dlg');
    dlg.innerHTML = `<form method="dialog"><h3>${esc(title)}</h3>` + fields.map(f => {
      if (f.type === 'select')
        return `<label>${esc(f.label)}<select name="${f.name}">${f.options.map(o => `<option${o === f.value ? ' selected' : ''}>${esc(o)}</option>`).join('')}</select></label>`;
      return `<label>${esc(f.label)}<input name="${f.name}" type="${f.type || 'text'}" value="${esc(f.value ?? '')}"${f.list ? ` list="${f.list}"` : ''}${f.required ? ' required' : ''} autocomplete="off"></label>`;
    }).join('') + `<menu><button class="btn" value="cancel" formnovalidate>취소</button><button class="btn primary" value="ok">${esc(okLabel)}</button></menu></form>`;
    dlg.returnValue = '';
    dlg.onclose = () => {
      if (dlg.returnValue !== 'ok') return res(null);
      const o = {};
      for (const f of fields) o[f.name] = dlg.querySelector(`[name="${f.name}"]`).value.trim();
      res(o);
    };
    dlg.showModal();
  });
}

/* ---------- 렌더링 ---------- */
function render() {
  const nOpen = S.issues.filter(i => i.status === 'open').length;
  const nClosed = S.issues.length - nOpen;
  const nToday = dayEntries(today()).length;
  $('#tabs').innerHTML = [['open', '진행중', nOpen], ['day', '일자별 변경분', nToday], ['closed', '종료 이력', nClosed]]
    .map(([k, l, n]) => `<button data-tab="${k}" class="${tab === k ? 'on' : ''}">${l}<span class="n">${n}</span></button>`).join('');

  const lf = $('#layerFilter'), cur = lf.value, ls = layers();
  lf.innerHTML = '<option value="">전체 레이어</option>' + ls.map(l => `<option${l === cur ? ' selected' : ''}>${esc(l)}</option>`).join('');
  $('#layerList').innerHTML = ls.map(l => `<option value="${esc(l)}">`).join('');

  const main = $('#main');
  if (tab === 'open') main.innerHTML = addFormHtml() + listHtml('open');
  else if (tab === 'closed') main.innerHTML = listHtml('closed');
  else main.innerHTML = dayHtml();
}

function addFormHtml() {
  return `<form class="addform" id="addForm" autocomplete="off">
    <input name="layer" list="layerList" placeholder="레이어 (구분)" required>
    <input name="chamber" placeholder="챔버" required>
    <input name="wafers" placeholder="최초 누적매수" inputmode="numeric">
    <input name="symptom" placeholder="증상 (예: 센터맵 다발)" required>
    <input name="date" type="date" value="${today()}" title="조치 날짜">
    <input name="action" placeholder="조치 내용 (선택)">
    <button class="btn primary">등록</button>
    <div class="hint">챔버 칸에 <b>11A 2232매 센터맵 다발</b> 처럼 한 줄로 적고 Tab 을 누르면 자동으로 나뉩니다. 레이어는 새 이름을 적으면 새 구분이 생깁니다.</div>
  </form>`;
}

function listHtml(status) {
  const groups = groupByLayer(visibleIssues(status));
  if (!groups.length) return `<div class="empty">${status === 'open' ? '진행중인 이슈가 없습니다.' : '종료된 이력이 없습니다.'}</div>`;
  return groups.map(([layer, list]) => {
    list.sort(status === 'open' ? (a, b) => natCmp(a.chamber, b.chamber) : (a, b) => (b.closedAt || '').localeCompare(a.closedAt || ''));
    return `<section class="layer">
      <div class="layer-h"><h2>${esc(layer)}</h2><span class="cnt">${list.length}건</span><span class="spacer"></span>
        <button class="btn sm" data-act="copyLayer" data-layer="${esc(layer)}" data-status="${status}">전체 복사</button>
        <button class="btn sm" data-act="renameLayer" data-layer="${esc(layer)}">이름 변경</button></div>
      ${list.map(cardHtml).join('')}</section>`;
  }).join('');
}

function cardHtml(i) {
  const open = i.status === 'open', t = today();
  return `<div class="card" data-id="${i.id}">
    <div class="card-h">
      <span class="ch">${esc(i.chamber)}</span>
      ${i.wafers ? `<span class="wf">${esc(i.wafers)}매</span>` : ''}
      <span class="sym">${esc(i.symptom)}</span>
      ${open ? '' : `<span class="closed-tag">${fmtDate(i.closedAt)} ${esc(i.closeReason)}${i.closeMemo ? ' · ' + esc(i.closeMemo) : ''}</span>`}
      <span class="spacer"></span>
      <button class="btn sm" data-act="copyIssue">복사</button>
      <button class="btn sm" data-act="editIssue">수정</button>
      ${open ? '<button class="btn sm ok" data-act="closeIssue">수리/PM 완료</button>'
             : '<button class="btn sm" data-act="reopen">진행중으로 되돌리기</button><button class="btn sm danger" data-act="delIssue">삭제</button>'}
    </div>
    <ul class="acts">${sortedActs(i).map(a => `<li data-aid="${a.id}" class="${a.date === t ? 'today' : ''}">
      <span class="d">${fmtDate(a.date)}</span><span class="t">${esc(a.text)}</span>
      <span class="x"><button class="link" data-act="editAct">수정</button><button class="link" data-act="delAct">삭제</button></span></li>`).join('')}</ul>
    ${open ? `<form class="addact" data-act="addAct"><input type="date" name="date" value="${t}"><input type="text" name="text" placeholder="조치 추가 후 Enter" required autocomplete="off"><button class="btn sm">추가</button></form>` : ''}
  </div>`;
}

function dayEntries(d) {
  const out = [];
  for (const i of S.issues) {
    for (const a of i.actions) if (a.date === d) out.push({issue: i, text: a.text});
    if (i.status === 'closed' && i.closedAt === d) out.push({issue: i, text: `[종료] ${i.closeReason}${i.closeMemo ? ' ' + i.closeMemo : ''}`});
  }
  const lf = $('#layerFilter').value, q = $('#q').value.trim().toLowerCase();
  return out.filter(e => (!lf || e.issue.layer === lf) && (!q || (headLine(e.issue) + ' ' + e.text + ' ' + e.issue.layer).toLowerCase().includes(q)));
}
function dayGroups(d) {
  const m = new Map();
  for (const e of dayEntries(d)) { if (!m.has(e.issue.layer)) m.set(e.issue.layer, []); m.get(e.issue.layer).push(e); }
  return [...m.entries()].sort((a, b) => natCmp(a[0], b[0]))
    .map(([l, es]) => [l, es.sort((a, b) => natCmp(a.issue.chamber, b.issue.chamber))]);
}
function dayText(d) {
  return `[${fmtDate(d)} 변경분]\n` + dayGroups(d).map(([l, es]) =>
    `■ ${l}\n` + es.map(e => `${headLine(e.issue)} - ${e.text}`).join('\n')).join('\n');
}
function dayHtml() {
  const groups = dayGroups(dayDate);
  return `<div class="daybar">
      <button class="btn" data-act="dayShift" data-n="-1">◀ 이전</button>
      <input type="date" id="dayDate" value="${dayDate}">
      <button class="btn" data-act="dayShift" data-n="1">다음 ▶</button>
      <button class="btn" data-act="dayToday">오늘</button>
      <span class="spacer"></span>
      <button class="btn primary" data-act="copyDay">이 날짜 변경분 복사</button>
    </div>` +
    (groups.length ? groups.map(([l, es]) => `<section class="layer">
      <div class="layer-h"><h2>${esc(l)}</h2><span class="cnt">${es.length}건</span></div>
      ${es.map(e => `<div class="dayrow"><span class="ch">${esc(e.issue.chamber)}</span>
        ${e.issue.wafers ? `<span class="wf">${esc(e.issue.wafers)}매</span>` : ''}<span class="sym">${esc(e.issue.symptom)}</span>
        <span class="what">${esc(e.text)}</span></div>`).join('')}</section>`).join('')
      : `<div class="empty">${fmtDate(dayDate)} 에 기록된 변경이 없습니다.</div>`);
}

/* ---------- 이벤트 ---------- */
$('#tabs').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) { tab = b.dataset.tab; render(); } });
$('#q').addEventListener('input', () => { const p = $('#q').selectionStart; render(); $('#q').focus(); $('#q').setSelectionRange(p, p); });
$('#layerFilter').addEventListener('change', render);

$('#main').addEventListener('change', e => {
  if (e.target.id === 'dayDate' && e.target.value) { dayDate = e.target.value; render(); }
  if (e.target.name === 'chamber' && e.target.form?.id === 'addForm') {
    const m = e.target.value.trim().match(/^(\S+)\s+([\d,]+)\s*매\s*(.*)$/);
    if (m) {
      const f = e.target.form;
      f.chamber.value = m[1]; f.wafers.value = m[2].replace(/,/g, '');
      if (m[3] && !f.symptom.value) f.symptom.value = m[3];
    }
  }
});

$('#main').addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === 'addForm') {
    const v = n => f[n].value.trim();
    const layer = v('layer'), chamber = v('chamber'), action = v('action'), date = v('date') || today();
    const dup = S.issues.find(i => i.status === 'open' && i.layer === layer && i.chamber.toLowerCase() === chamber.toLowerCase());
    if (dup) {
      if (action) {
        if (confirm(`${layer} ${chamber} 은(는) 이미 진행중입니다.\n\n[확인] 기존 카드에 조치만 추가\n[취소] 새 이슈로 따로 등록`)) {
          dup.actions.push({id: uid(), date, text: action}); save(); toast('기존 카드에 조치를 추가했습니다'); return;
        }
      } else if (!confirm(`${layer} ${chamber} 은(는) 이미 진행중입니다. 그래도 새로 등록할까요?`)) return;
    }
    S.issues.push({id: uid(), layer, chamber, wafers: v('wafers').replace(/[^\d]/g, ''), symptom: v('symptom'),
      status: 'open', createdAt: today(), actions: action ? [{id: uid(), date, text: action}] : []});
    save();
    $('#addForm').layer.value = layer; $('#addForm').chamber.focus();
  } else if (f.dataset.act === 'addAct') {
    const i = issueById(f.closest('.card').dataset.id);
    i.actions.push({id: uid(), date: f.date.value || today(), text: f.text.value.trim()});
    save();
    document.querySelector(`.card[data-id="${i.id}"] .addact input[type=text]`)?.focus();
  }
});

$('#main').addEventListener('click', async e => {
  const b = e.target.closest('button[data-act]'); if (!b) return;
  const act = b.dataset.act;
  const card = b.closest('.card'), i = card && issueById(card.dataset.id);
  const aid = b.closest('li')?.dataset.aid;

  if (act === 'copyIssue') copy(issueLine(i));
  else if (act === 'copyLayer') {
    const list = visibleIssues(b.dataset.status).filter(x => x.layer === b.dataset.layer).sort((a, c) => natCmp(a.chamber, c.chamber));
    copy(`■ ${b.dataset.layer}\n` + list.map(issueLine).join('\n'));
  }
  else if (act === 'renameLayer') {
    const old = b.dataset.layer;
    const r = await ask('레이어 이름 변경', [{name: 'layer', label: '레이어 이름 (기존 다른 레이어 이름을 적으면 합쳐집니다)', value: old, list: 'layerList', required: true}]);
    if (r && r.layer && r.layer !== old) { S.issues.forEach(x => { if (x.layer === old) x.layer = r.layer; }); save(); }
  }
  else if (act === 'editIssue') {
    const r = await ask('이슈 수정', [
      {name: 'layer', label: '레이어', value: i.layer, list: 'layerList', required: true},
      {name: 'chamber', label: '챔버', value: i.chamber, required: true},
      {name: 'wafers', label: '최초 누적매수', value: i.wafers},
      {name: 'symptom', label: '증상', value: i.symptom, required: true}]);
    if (r) { Object.assign(i, r, {wafers: r.wafers.replace(/[^\d]/g, '')}); save(); }
  }
  else if (act === 'closeIssue') {
    const r = await ask(`${i.chamber} 종료 처리`, [
      {name: 'closeReason', label: '사유', type: 'select', options: ['PM', '수리', '기타'], value: 'PM'},
      {name: 'closedAt', label: '종료일', type: 'date', value: today(), required: true},
      {name: 'closeMemo', label: '메모 (선택)', value: ''}], '종료 이력으로 이동');
    if (r) { Object.assign(i, r, {status: 'closed'}); save(); toast('종료 이력으로 옮겼습니다'); }
  }
  else if (act === 'reopen') { i.status = 'open'; delete i.closedAt; delete i.closeReason; delete i.closeMemo; save(); toast('진행중으로 되돌렸습니다'); }
  else if (act === 'delIssue') { if (confirm(`${headLine(i)}\n\n이 이력을 완전히 삭제할까요? 되돌릴 수 없습니다.`)) { S.issues = S.issues.filter(x => x !== i); save(); } }
  else if (act === 'editAct') {
    const a = i.actions.find(x => x.id === aid);
    const r = await ask('조치 수정', [{name: 'date', label: '날짜', type: 'date', value: a.date, required: true}, {name: 'text', label: '내용', value: a.text, required: true}]);
    if (r) { Object.assign(a, r); save(); }
  }
  else if (act === 'delAct') {
    const a = i.actions.find(x => x.id === aid);
    if (confirm(`"${fmtDate(a.date)} ${a.text}" 조치를 삭제할까요?`)) { i.actions = i.actions.filter(x => x !== a); save(); }
  }
  else if (act === 'dayShift') { const d = new Date(dayDate + 'T00:00:00'); d.setDate(d.getDate() + (+b.dataset.n)); dayDate = iso(d); render(); }
  else if (act === 'dayToday') { dayDate = today(); render(); }
  else if (act === 'copyDay') copy(dayText(dayDate));
});

$('#exportBtn').addEventListener('click', () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 2)], {type: 'application/json'}));
  a.download = `chamber-log-${today()}.json`; a.click(); URL.revokeObjectURL(a.href);
});
$('#importBtn').addEventListener('click', () => $('#importFile').click());
$('#importFile').addEventListener('change', async e => {
  const file = e.target.files[0]; e.target.value = ''; if (!file) return;
  try {
    const d = JSON.parse(await file.text());
    if (!d || !Array.isArray(d.issues)) throw 0;
    if (!confirm(`백업 파일(${d.issues.length}건)로 현재 데이터(${S.issues.length}건)를 덮어씁니다. 계속할까요?`)) return;
    d.issues.forEach(i => { i.actions = Array.isArray(i.actions) ? i.actions : []; i.status = i.status === 'closed' ? 'closed' : 'open'; });
    S = {issues: d.issues}; save(); toast('불러왔습니다');
  } catch (err) { alert('올바른 백업 파일이 아닙니다.'); }
});

render();
</script>
</body>
</html>
