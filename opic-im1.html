<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- page -->
<title>오픽 IM1 7일 완성</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Layout: one-screen app shell (top bar / scrolling main / bottom tabs) in a single 640px column.
   Korean UI is set in the sans face, English to be spoken is set in the serif face. */
:root {
  --bg: #F1F4F8; --surface: #FFFFFF; --surface-2: #E7ECF3; --line: #D7DEE8;
  --ink: #121B26; --ink-2: #465467; --ink-3: #6E7D91;
  --brand: #1D4ED8; --brand-ink: #FFFFFF; --brand-soft: #E2E9FB;
  --rec: #D43C3C; --rec-soft: #FBE6E4;
  --good: #1B8756; --good-soft: #DDF2E7; --warn: #A2640C; --warn-soft: #FAEFD6;
  --hero: #14274A; --hero-ink: #F3F6FB; --hero-dim: #A9B8D2; --hero-bar: #33486F; --goal: #FFC857;
  --font-ui: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
  --font-en: "Source Serif 4", Georgia, "Times New Roman", serif;
  --r: 14px; --r-sm: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E141B; --surface: #18212C; --surface-2: #222D3A; --line: #2D3A49;
    --ink: #E9EEF4; --ink-2: #B1BDCB; --ink-3: #8593A4;
    --brand: #86A4FF; --brand-ink: #0B1324; --brand-soft: #1E2B4D;
    --rec: #FF6F6F; --rec-soft: #3B2023;
    --good: #52C792; --good-soft: #153223; --warn: #E7B659; --warn-soft: #352B10;
    --hero: #1B2A47; --hero-ink: #F3F6FB; --hero-dim: #A9B8D2; --hero-bar: #3A4F78; --goal: #FFC857;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E141B; --surface: #18212C; --surface-2: #222D3A; --line: #2D3A49;
  --ink: #E9EEF4; --ink-2: #B1BDCB; --ink-3: #8593A4;
  --brand: #86A4FF; --brand-ink: #0B1324; --brand-soft: #1E2B4D;
  --rec: #FF6F6F; --rec-soft: #3B2023;
  --good: #52C792; --good-soft: #153223; --warn: #E7B659; --warn-soft: #352B10;
  --hero: #1B2A47; --hero-ink: #F3F6FB; --hero-dim: #A9B8D2; --hero-bar: #3A4F78; --goal: #FFC857;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html { height: 100%; padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); }
body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 var(--font-ui); -webkit-text-size-adjust: 100%; }
[hidden] { display: none !important; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3, p, ul, ol { margin: 0; }
ul, ol { padding: 0; list-style: none; }
h1 { font-size: 24px; line-height: 1.3; letter-spacing: -.02em; text-wrap: balance; }
h2 { font-size: 18px; line-height: 1.35; letter-spacing: -.01em; text-wrap: balance; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
svg { flex: 0 0 auto; }

.app { height: 100%; display: flex; flex-direction: column; }
.wrap { width: 100%; max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top { flex: 0 0 auto; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { display: flex; align-items: center; gap: 10px; min-height: 52px; }
.top-title { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.25; }
.top-title strong { font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top-title span { font-size: 12px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top-badge { flex: 0 0 auto; padding: 3px 10px; border-radius: 99px; background: var(--brand-soft); color: var(--brand); font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
.icon-btn { width: 36px; height: 36px; margin-left: -8px; display: grid; place-items: center; border: 0; border-radius: 50%; background: none; }
.icon-btn:hover { background: var(--surface-2); }
main { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
#view { display: flex; flex-direction: column; gap: 14px; padding-block: 16px 28px; }
.tabs { flex: 0 0 auto; background: var(--surface); border-top: 1px solid var(--line); }
.tabs-in { display: grid; grid-template-columns: repeat(5, 1fr); }
.tabs a { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0 7px; color: var(--ink-3); text-decoration: none; font-size: 11px; font-weight: 600; }
.tabs a[aria-current="page"] { color: var(--brand); }
.tabs svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
body.onb .tabs { display: none; }

.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .06em; color: var(--ink-3); text-transform: uppercase; }
.muted { color: var(--ink-2); font-size: 14px; }
.fine { color: var(--ink-3); font-size: 12px; }
.en { font-family: var(--font-en); font-size: 17px; line-height: 1.55; }
.ko { color: var(--ink-2); font-size: 14px; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.sect-title { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-top: 6px; }
.sect-title h2 { font-size: 16px; }
.sect-title span { color: var(--ink-3); font-size: 13px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 46px; padding: 0 18px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); font-weight: 600; text-decoration: none; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.btn.primary:hover { filter: brightness(1.08); background: var(--brand); }
.btn.small { min-height: 36px; padding: 0 12px; font-size: 13px; }
.btn.block { width: 100%; }
.btn.danger { color: var(--rec); }
.btn:disabled { opacity: .5; cursor: default; }
.linkbtn { border: 0; background: none; padding: 6px 4px; color: var(--brand); font-weight: 600; font-size: 13px; text-decoration: underline; text-underline-offset: 3px; }
.row-btns { display: flex; flex-wrap: wrap; gap: 8px; }
.row-btns.end { justify-content: flex-end; }
.row-btns.split > * { flex: 1; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; padding: 2px 9px; border-radius: 99px; background: var(--brand-soft); color: var(--brand); font-size: 12px; font-weight: 700; white-space: nowrap; }
.chip.ghost { background: var(--surface-2); color: var(--ink-2); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.good { background: var(--good-soft); color: var(--good); }
.meter { display: block; height: 6px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 99px; background: var(--brand); }

/* hero + level ladder */
.hero { background: var(--hero); color: var(--hero-ink); border-radius: var(--r); padding: 20px 18px 18px; display: flex; flex-direction: column; gap: 10px; }
.hero .eyebrow { color: var(--goal); }
.hero p { color: var(--hero-dim); font-size: 14px; }
.hero .btn.primary { background: var(--goal); border-color: var(--goal); color: #1B1403; }
.ladder { display: grid; grid-template-columns: repeat(9, 1fr); align-items: end; gap: 4px; margin: 8px 0 4px; }
.rung { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
.rung .bar { width: 100%; border-radius: 4px 4px 2px 2px; background: var(--hero-bar); }
.rung b { font-size: 11px; font-weight: 600; color: var(--hero-dim); font-variant-numeric: tabular-nums; }
.rung i { height: 14px; font-style: normal; font-size: 10px; font-weight: 700; line-height: 14px; white-space: nowrap; }
.rung.goal .bar { background: var(--goal); }
.rung.goal b, .rung.goal i { color: var(--goal); }
.rung.cur .bar { outline: 2px solid var(--hero-ink); outline-offset: 2px; }
.rung.cur b, .rung.cur i { color: var(--hero-ink); }

.hero .fine-hero { font-size: 12px; }
.recorder .field { align-self: stretch; text-align: left; }
.recorder .row-btns { justify-content: center; }
.card ul:not([class]) { display: flex; flex-direction: column; gap: 4px; padding-left: 18px; list-style: disc; color: var(--ink-2); }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 12px; min-width: 0; }
.tile b { display: block; font-size: 20px; line-height: 1.2; font-variant-numeric: tabular-nums; }
.tile small { color: var(--ink-3); font-size: 12px; }

/* course */
.daycard, .step, .qrow { display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); text-align: left; }
.daycard:hover, .step:hover, .qrow:hover { border-color: var(--brand); }
.daycard.now { border-color: var(--brand); box-shadow: inset 3px 0 0 var(--brand); }
.dnum { flex: 0 0 auto; width: 46px; font-size: 11px; font-weight: 700; letter-spacing: .04em; color: var(--ink-3); }
.daycard.now .dnum { color: var(--brand); }
.dbody, .sbody, .qbody { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.dbody small, .sbody small, .qbody small { color: var(--ink-2); font-size: 13px; }
.dbody .meter { margin-top: 5px; }
.dstat, .sgo { flex: 0 0 auto; font-size: 12px; font-weight: 700; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.daycard.done .dstat { color: var(--good); }
.dayhead { display: flex; flex-direction: column; gap: 6px; padding: 4px 2px 6px; }
.lead { color: var(--ink-2); }
.steps { display: flex; flex-direction: column; gap: 8px; }
.snum { flex: 0 0 auto; width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; background: var(--surface-2); color: var(--ink-2); font-size: 13px; font-weight: 700; }
.step.done .snum { background: var(--good-soft); color: var(--good); }
.step.next { border-color: var(--brand); }
.step.next .snum { background: var(--brand); color: var(--brand-ink); }
.step.next .sgo { color: var(--brand); }
.dots { display: flex; gap: 5px; }
.dots i { flex: 1; height: 4px; border-radius: 99px; background: var(--surface-2); }
.dots i.on { background: var(--brand); }
.lesson h2 { font-size: 20px; }
.lesson p, .lesson li { color: var(--ink-2); }
.lesson b { color: var(--ink); }
.lesson ul { display: flex; flex-direction: column; gap: 6px; padding-left: 18px; list-style: disc; }
.lesson .en { color: var(--ink); background: var(--surface-2); border-radius: var(--r-sm); padding: 10px 12px; font-size: 16px; }
.lesson table { width: 100%; border-collapse: collapse; font-size: 14px; }
.lesson td, .lesson th { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.lesson th { color: var(--ink-3); font-size: 12px; font-weight: 600; }
.tablebox { overflow-x: auto; }
.pattern { display: flex; gap: 10px; align-items: flex-start; }
.pattern .pbody { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.pattern .en { font-weight: 600; }
.pattern .ex { font-family: var(--font-en); font-size: 15px; color: var(--ink-2); margin-top: 4px; }
.playbtn { flex: 0 0 auto; width: 38px; height: 38px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 50%; background: var(--surface); color: var(--brand); }
.playbtn:hover { background: var(--brand-soft); }

/* question + studio */
.qtext { font-size: 18px; }
.sents { display: flex; flex-direction: column; gap: 6px; }
.sent { display: flex; flex-direction: column; gap: 1px; width: 100%; padding: 9px 12px; border: 1px solid transparent; border-radius: var(--r-sm); background: var(--surface-2); text-align: left; }
.sent:hover { border-color: var(--brand); }
.sent.on { background: var(--brand-soft); border-color: var(--brand); }
.sent .ko { font-size: 13px; }
.fold { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.fold > summary { padding: 13px 16px; font-weight: 600; cursor: pointer; list-style-position: inside; }
.fold > :not(summary) { margin: 0 16px 14px; }
.tips { display: flex; flex-direction: column; gap: 4px; padding-left: 20px; list-style: decimal; color: var(--ink-2); }
.recorder { align-items: center; text-align: center; gap: 8px; padding-block: 20px; }
.timer { font-size: 30px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.recbtn { position: relative; width: 76px; height: 76px; border: 0; border-radius: 50%; background: var(--rec); display: grid; place-items: center; }
.recbtn::before { content: ""; width: 26px; height: 26px; border-radius: 50%; background: #fff; transition: border-radius .15s; }
.recbtn.on::before { border-radius: 5px; }
.recbtn.on::after { content: ""; position: absolute; inset: -7px; border-radius: 50%; border: 3px solid var(--rec); opacity: .5; animation: pulse 1.4s ease-out infinite; }
@keyframes pulse { from { transform: scale(.92); opacity: .6; } to { transform: scale(1.15); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .recbtn.on::after { animation: none; } .recbtn::before { transition: none; } }
.live { width: 100%; padding: 10px 12px; border-radius: var(--r-sm); background: var(--surface-2); text-align: left; max-height: 9.5em; overflow-y: auto; }
.note { width: 100%; padding: 8px 12px; border-radius: var(--r-sm); background: var(--warn-soft); color: var(--warn); font-size: 13px; text-align: left; }
.recorder textarea, .field textarea, .fold textarea { width: 100%; }
audio { width: 100%; height: 40px; }

.fb-head { display: flex; align-items: center; gap: 16px; }
.ring { position: relative; flex: 0 0 auto; width: 88px; height: 88px; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(var(--brand) calc(var(--p) * 1%), var(--surface-2) 0); }
.ring::before { content: ""; position: absolute; inset: 8px; border-radius: 50%; background: var(--surface); }
.ring b { position: relative; font-size: 26px; font-variant-numeric: tabular-nums; }
.metrics { display: flex; flex-direction: column; }
.metrics li { display: flex; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); }
.metrics .dot { flex: 0 0 auto; width: 10px; height: 10px; margin-top: 7px; border-radius: 50%; background: var(--rec); }
.metrics .good .dot { background: var(--good); }
.metrics .mid .dot { background: var(--goal); }
.metrics div { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; }
.metrics strong { font-size: 14px; }
.metrics .mv { color: var(--ink-2); font-size: 14px; font-variant-numeric: tabular-nums; }
.metrics small { flex-basis: 100%; color: var(--ink-2); font-size: 13px; }
.mine { padding: 12px; border-radius: var(--r-sm); background: var(--surface-2); }
.ai { display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: var(--r-sm); border: 1px solid var(--brand); background: var(--brand-soft); }
.ai li { padding: 6px 0; }
.ai del { color: var(--rec); text-decoration-thickness: 1px; }
.ai ins { color: var(--good); text-decoration: none; font-weight: 600; }
.ai .en { font-size: 15px; }

/* quiz, forms */
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); text-align: left; }
.opt:hover:not(:disabled) { border-color: var(--brand); }
.opt.right { border-color: var(--good); background: var(--good-soft); color: var(--good); font-weight: 600; }
.opt.wrong { border-color: var(--rec); background: var(--rec-soft); color: var(--rec); }
.opt:disabled { cursor: default; }
.why { padding: 10px 12px; border-radius: var(--r-sm); background: var(--surface-2); color: var(--ink-2); font-size: 14px; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field label, .field > span { font-size: 13px; font-weight: 600; color: var(--ink-2); }
input[type="text"], input[type="date"], textarea, select { width: 100%; min-height: 44px; padding: 9px 12px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); }
textarea { font-family: var(--font-en); font-size: 16px; line-height: 1.5; resize: vertical; }
input[type="range"] { width: 100%; accent-color: var(--brand); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
.choice { display: flex; flex-wrap: wrap; gap: 8px; }
.choice button { padding: 9px 14px; border: 1px solid var(--line); border-radius: 99px; background: var(--surface); font-weight: 600; font-size: 14px; }
.choice button[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.check { display: flex; align-items: center; gap: 10px; font-size: 14px; }
.check input { width: 18px; height: 18px; accent-color: var(--brand); }
.scroller { overflow-x: auto; margin: 0 -4px; padding: 2px 4px 6px; }
.scroller .choice { flex-wrap: nowrap; }
.scroller .choice button { white-space: nowrap; }

/* mock */
.mockbar { display: flex; align-items: center; gap: 16px; }
.mockbar > div:first-child { flex: 1; display: flex; flex-direction: column; gap: 6px; }
.clock { text-align: right; line-height: 1.2; }
.clock small { display: block; color: var(--ink-3); font-size: 11px; }
.clock b { font-size: 20px; font-variant-numeric: tabular-nums; }
.ava { align-items: center; text-align: center; }
.ava-face { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; background: var(--hero); color: var(--goal); font: 600 28px var(--font-en); }
.bars { display: flex; flex-direction: column; gap: 8px; }
.bars li { display: grid; grid-template-columns: 96px 1fr 34px; align-items: center; gap: 10px; font-size: 13px; }
.bars .meter { height: 10px; }
.bars b { text-align: right; font-variant-numeric: tabular-nums; }
.bars li.low .meter i { background: var(--rec); }

/* review */
.seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 4px; border-radius: var(--r-sm); background: var(--surface-2); }
.seg button { min-height: 36px; border: 0; border-radius: 7px; background: none; font-size: 13px; font-weight: 600; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, .12); }
.flash { min-height: 230px; justify-content: center; align-items: center; text-align: center; gap: 12px; padding: 24px 18px; }
.flash .ko { font-size: 18px; color: var(--ink); font-weight: 600; }
.flash .en { font-size: 21px; font-weight: 600; }
.flash .ex { font-family: var(--font-en); color: var(--ink-2); }
.chart { position: relative; display: flex; align-items: flex-end; gap: 6px; height: 150px; padding-top: 18px; border-bottom: 1px solid var(--line); }
.chart .col { flex: 1; min-width: 0; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 3px; }
.chart .col span { font-size: 11px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.chart .col i { width: 100%; max-width: 34px; border-radius: 4px 4px 0 0; background: var(--brand); min-height: 2px; }
.chart .col.hit i { background: var(--good); }
.chart .goalline { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--ink-3); }
.empty { align-items: center; text-align: center; padding: 28px 18px; color: var(--ink-2); }
.feature-list { display: flex; flex-direction: column; gap: 8px; }
.feature-list li { display: flex; flex-direction: column; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); }
.feature-list small { color: var(--ink-2); font-size: 13px; }
.toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); max-width: calc(100% - 32px); padding: 10px 16px; border-radius: 99px; background: var(--ink); color: var(--bg); font-size: 14px; font-weight: 600; z-index: 20; text-align: center; }
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="wrap top-in">
      <button class="icon-btn" id="backBtn" data-act="back" aria-label="뒤로" hidden><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <div class="top-title"><strong id="topTitle">오픽 IM1 7일 완성</strong><span id="topSub"></span></div>
      <span class="top-badge" id="topBadge" hidden></span>
    </div>
  </header>
  <main id="main"><div class="wrap" id="view"></div></main>

There is also a long path for walking and riding bikes. | 걷거나 자전거를 탈 수 있는 긴 길도 있어요.
You can see the river from the park. | 공원에서 강을 볼 수 있습니다.
Many people come there with their families or dogs. | 많은 사람들이 가족이나 강아지와 함께 와요.
The air is fresh, so I feel good there. | 공기가 맑아서 거기 가면 기분이 좋습니다.
It is my favorite place in my neighborhood. | 우리 동네에서 제가 가장 좋아하는 곳이에요.`),
Q('park-routine', 'routine', '공원', 'What do you usually do at the park? When do you go, and who do you go with?', '공원에서 보통 무엇을 하나요? 언제, 누구와 가나요?',
  ['언제, 누구와', '스트레칭 → 걷기 → 쉬기 순서로', '끝나고 하는 일과 좋은 점'], `
I usually go to the park on weekend mornings. | 저는 보통 주말 아침에 공원에 가요.
I go there alone or with my family. | 혼자 가거나 가족과 함께 갑니다.
First, I do some light stretching. | 먼저 가볍게 스트레칭을 해요.
Then I walk along the river for about an hour. | 그러고 나서 강을 따라 한 시간 정도 걷습니다.
While I walk, I listen to music. | 걸으면서 음악을 들어요.
Sometimes I sit on a bench and drink coffee. | 가끔 벤치에 앉아 커피를 마십니다.
When the weather is nice, we have a picnic there. | 날씨가 좋으면 거기서 소풍을 즐겨요.
After that, I go home and take a shower. | 그 후에 집에 가서 샤워를 합니다.
Walking in the park makes me healthy. | 공원에서 걷는 것은 저를 건강하게 해 줘요.`),
Q('park-past', 'past', '공원', 'Tell me about a memorable thing that happened at a park. What happened, and why was it memorable?', '공원에서 있었던 기억에 남는 일을 말해 주세요. 무슨 일이 있었고 왜 기억에 남나요?',
  ['언제, 누구와, 날씨', '무엇을 했는지 → 갑자기 생긴 일', '기분과 마무리'], `
Last spring, I went to the park with my family. | 지난봄에 가족과 공원에 갔어요.
The weather was warm and sunny. | 날씨가 따뜻하고 화창했습니다.
There were cherry blossoms everywhere. | 어디에나 벚꽃이 피어 있었어요.
We brought gimbap and fruit, and we had a picnic under a tree. | 김밥과 과일을 가져가서 나무 아래에서 소풍을 했습니다.
Suddenly, it started to rain. | 갑자기 비가 내리기 시작했어요.
We didn't have umbrellas, so we ran to the car. | 우산이 없어서 차까지 뛰어갔습니다.
We got wet, but we laughed a lot. | 비에 젖었지만 많이 웃었어요.
It was a funny day. | 재미있는 하루였습니다.
So I still remember it. | 그래서 아직도 기억나요.`),

Q('trip-desc', 'desc', '국내 여행', 'You indicated that you take trips in your country. Describe a place you like to visit. Why do you like it?', '국내 여행을 한다고 하셨네요. 가고 싶어 하는 장소를 묘사해 주세요. 왜 좋아하나요?',
  ['좋아하는 여행지와 위치', '거기에 있는 것 · 음식', '좋아하는 이유'], `
I like traveling around my country. | 저는 국내 여행을 좋아해요.
My favorite place is Jeju Island. | 가장 좋아하는 곳은 제주도입니다.
It is a beautiful island in the south of Korea. | 한국 남쪽에 있는 아름다운 섬이에요.
It takes about one hour by plane from Seoul. | 서울에서 비행기로 한 시간 정도 걸립니다.
There are beautiful beaches and a high mountain. | 아름다운 해변과 높은 산이 있어요.
The sea is clean and blue. | 바다가 깨끗하고 파랗습니다.
The food is delicious, too. | 음식도 맛있어요.
I especially like the seafood there. | 저는 특히 그곳의 해산물을 좋아합니다.
I like Jeju because I can relax and forget about work. | 쉬면서 일을 잊을 수 있어서 제주를 좋아해요.`),
Q('trip-routine', 'routine', '국내 여행', 'What do you usually do to prepare for a trip? Tell me about the things you do before you travel.', '여행을 준비할 때 보통 무엇을 하나요? 여행 가기 전에 하는 일들을 말해 주세요.',
  ['장소 정하기 → 예약하기', '맛집 찾기 → 짐 싸기', '나만의 습관 한 가지'], `
Before a trip, I do many things. | 여행 전에 저는 여러 가지를 해요.
First, I choose a place and check the weather. | 먼저 장소를 정하고 날씨를 확인합니다.
Then I book a hotel and tickets on the Internet. | 그러고 나서 인터넷으로 호텔과 표를 예약해요.
I also look for good restaurants on my phone. | 휴대폰으로 맛집도 찾아봅니다.
The day before the trip, I pack my bag. | 여행 전날에는 짐을 싸요.
I usually pack clothes, a charger, and some medicine. | 보통 옷, 충전기, 약을 챙깁니다.
I always make a list, so I don't forget anything. | 항상 목록을 만들어서 아무것도 잊지 않아요.
Preparing for a trip is fun for me. | 여행 준비는 저에게 즐거운 일이에요.`),
Q('trip-past', 'past', '국내 여행', 'Tell me about a memorable trip you took. Where did you go, who did you go with, and what did you do?', '기억에 남는 여행에 대해 말해 주세요. 어디로, 누구와 갔고 무엇을 했나요?',
  ['언제, 어디로, 누구와, 교통편', '첫째 날 · 둘째 날에 한 일', '날씨, 음식, 한 줄 소감'], `
Two years ago, I went to Busan with my family. | 2년 전에 가족과 부산에 갔어요.
We went there by train. | 기차를 타고 갔습니다.
It took about three hours. | 세 시간 정도 걸렸어요.
On the first day, we went to Haeundae Beach. | 첫째 날에는 해운대 해수욕장에 갔습니다.
We swam in the sea and took many pictures. | 바다에서 수영하고 사진을 많이 찍었어요.
In the evening, we ate fresh seafood at a market. | 저녁에는 시장에서 신선한 해산물을 먹었습니다.
It was really delicious. | 정말 맛있었어요.
On the second day, we visited a famous temple. | 둘째 날에는 유명한 절을 방문했습니다.
It was the best trip of my life. | 제 인생 최고의 여행이었어요.`),

Q('phone-desc', 'desc', '휴대폰', 'Tell me about your cell phone. What does it look like, and what do you like about it?', '당신의 휴대폰에 대해 말해 주세요. 어떻게 생겼고 어떤 점이 마음에 드나요?',
  ['언제 샀는지, 색과 모양', '좋은 점 2~3개 (화면, 카메라, 배터리)', '마무리: 없으면 못 산다'], `
I have a smartphone. | 저는 스마트폰이 있어요.
I bought it two years ago. | 2년 전에 샀습니다.
It is black and thin. | 검은색이고 얇아요.
The screen is big, so it is good for watching videos. | 화면이 커서 영상을 보기에 좋습니다.
The camera is also very good. | 카메라도 아주 좋아요.
I can take nice pictures with it. | 이걸로 멋진 사진을 찍을 수 있습니다.
The battery lasts all day. | 배터리가 하루 종일 가요.
I use my phone for everything. | 저는 모든 일에 휴대폰을 사용합니다.
I can't live without it. | 휴대폰 없이는 못 살아요.`, 1),
Q('phone-routine', 'routine', '휴대폰', 'What do you usually do with your phone? How often do you use it?', '휴대폰으로 보통 무엇을 하나요? 얼마나 자주 사용하나요?',
  ['아침 → 지하철 → 회사 → 저녁 순서로', '편리한 기능 한 가지', '하루 사용 시간과 내 생각'], `
I use my phone all day. | 저는 하루 종일 휴대폰을 사용해요.
In the morning, I check the weather and the news. | 아침에는 날씨와 뉴스를 확인합니다.
On the subway, I watch videos or listen to music. | 지하철에서는 영상을 보거나 음악을 들어요.
At work, I send messages to my coworkers. | 회사에서는 동료들에게 메시지를 보냅니다.
I also use my phone to pay for things. | 물건값을 낼 때도 휴대폰을 써요.
It is very convenient. | 아주 편리합니다.
In the evening, I call my parents or chat with my friends. | 저녁에는 부모님께 전화하거나 친구들과 채팅해요.
I use my phone for about four hours a day. | 하루에 네 시간 정도 휴대폰을 사용합니다.
I think it is too much. | 너무 많이 쓰는 것 같아요.`, 1),
Q('phone-past', 'past', '휴대폰', 'Tell me about a problem you had with your phone. What happened, and how did you deal with it?', '휴대폰 때문에 겪었던 문제에 대해 말해 주세요. 무슨 일이 있었고 어떻게 대처했나요?',
  ['언제, 어떤 문제', '기분 → 서비스 센터에서 한 일', '그 후 달라진 점'], `
I had a problem with my phone last year. | 작년에 휴대폰에 문제가 있었어요.
I dropped my phone on the street. | 길에서 휴대폰을 떨어뜨렸습니다.
The screen was broken, and I couldn't see anything. | 화면이 깨져서 아무것도 볼 수 없었어요.
I was so sad because it was a new phone. | 새 휴대폰이라서 너무 슬펐습니다.
The next day, I went to a service center. | 다음 날 서비스 센터에 갔어요.
I waited for about an hour. | 한 시간 정도 기다렸습니다.
They changed the screen, and it cost a lot of money. | 화면을 교체해 줬는데 돈이 많이 들었어요.
After that, I bought a strong phone case. | 그 후에 튼튼한 휴대폰 케이스를 샀습니다.
Now I am very careful with my phone. | 이제는 휴대폰을 아주 조심해서 다뤄요.`, 1),

Q('weather-desc', 'desc', '날씨', 'Tell me about the weather and seasons in your country. What is each season like?', '당신 나라의 날씨와 계절에 대해 말해 주세요. 각 계절은 어떤가요?',
  ['사계절이 있다', '계절마다 한 문장씩', '가장 좋아하는 계절과 이유'], `
Korea has four seasons. | 한국에는 사계절이 있어요.
They are spring, summer, fall, and winter. | 봄, 여름, 가을, 겨울입니다.
Spring is warm, and there are many flowers. | 봄은 따뜻하고 꽃이 많이 펴요.
Summer is very hot and humid. | 여름은 아주 덥고 습합니다.
It rains a lot in July. | 7월에는 비가 많이 와요.
Fall is cool, and the sky is clear. | 가을은 선선하고 하늘이 맑습니다.
Winter is very cold, and it snows sometimes. | 겨울은 아주 춥고 가끔 눈이 와요.
My favorite season is fall because the weather is perfect for walking. | 걷기에 딱 좋은 날씨라서 가을을 가장 좋아해요.`, 1),
Q('weather-routine', 'routine', '날씨', 'What do you usually do in your favorite season? Tell me about your activities.', '가장 좋아하는 계절에 보통 무엇을 하나요? 하는 활동들을 말해 주세요.',
  ['좋아하는 계절', '그 계절에 하는 활동 2~3개', '마무리 한 문장'], `
My favorite season is fall. | 제가 가장 좋아하는 계절은 가을이에요.
In fall, I usually spend a lot of time outside. | 가을에는 보통 밖에서 시간을 많이 보냅니다.
On weekends, I go to the park and take a walk. | 주말에는 공원에 가서 산책해요.
Sometimes I go hiking with my friends. | 가끔 친구들과 등산을 갑니다.
The mountains are very beautiful in fall. | 가을에는 산이 아주 아름다워요.
After hiking, we always eat something delicious. | 등산 후에는 항상 맛있는 것을 먹습니다.
I also ride my bike along the river. | 강을 따라 자전거도 타요.
Fall is short, so I try to enjoy it. | 가을은 짧아서 즐기려고 노력해요.`, 1),
Q('weather-past', 'past', '날씨', 'Tell me about a time when the weather caused a problem for you. What happened?', '날씨 때문에 문제가 생겼던 때에 대해 말해 주세요. 무슨 일이 있었나요?',
  ['언제, 어떤 계획이 있었는지', '날씨가 어땠고 어떻게 됐는지', '대신 한 일과 배운 점'], `
Last summer, I had a problem because of the weather. | 지난여름에 날씨 때문에 문제가 있었어요.
I had a plan to go to the beach with my friends. | 친구들과 바다에 갈 계획이 있었습니다.
But on that day, it rained very hard. | 그런데 그날 비가 아주 많이 왔어요.
It was also very windy. | 바람도 많이 불었습니다.
So we canceled the trip. | 그래서 여행을 취소했어요.
I was really disappointed. | 정말 실망했습니다.
We went to a café and watched a movie instead. | 대신 카페에 가고 영화를 봤어요.
It was fun, but I still wanted to go to the beach. | 재미있었지만 여전히 바다에 가고 싶었습니다.
Now I always check the weather before I make plans. | 이제는 계획을 세우기 전에 항상 날씨를 확인해요.`, 1),

Q('rest-desc', 'desc', '음식점', 'Tell me about a restaurant you often go to. What kind of food does it serve?', '자주 가는 식당에 대해 말해 주세요. 어떤 음식을 파나요?',
  ['어떤 식당, 어디에, 얼마나 자주', '파는 음식과 가장 좋아하는 메뉴', '가격 · 사장님 · 가는 이유'], `
There is a Korean restaurant near my office. | 회사 근처에 한식당이 있어요.
I go there once or twice a week. | 일주일에 한두 번 갑니다.
The restaurant is small, but it is always crowded. | 식당은 작지만 항상 사람이 많아요.
It serves kimchi stew and grilled fish. | 김치찌개와 생선구이를 팝니다.
My favorite dish is kimchi stew. | 제가 가장 좋아하는 메뉴는 김치찌개예요.
It is a little spicy, but it is really delicious. | 조금 맵지만 정말 맛있습니다.
The price is cheap, and the owner is very kind. | 가격이 싸고 사장님이 아주 친절해요.
That's why I often go there with my coworkers. | 그래서 동료들과 자주 갑니다.`, 1),
Q('rest-routine', 'routine', '음식점', 'What do you usually do when you eat out? Who do you go with, and how do you choose a restaurant?', '외식할 때 보통 어떻게 하나요? 누구와 가고 식당은 어떻게 고르나요?',
  ['얼마나 자주, 누구와', '식당 고르기 → 예약 → 주문', '식사 후에 하는 일'], `
I eat out about once a week. | 저는 일주일에 한 번 정도 외식해요.
I usually go with my family on weekends. | 보통 주말에 가족과 갑니다.
First, I search for a good restaurant on my phone. | 먼저 휴대폰으로 좋은 식당을 검색해요.
I read the reviews and look at the pictures. | 후기를 읽고 사진을 봅니다.
Then I make a reservation. | 그러고 나서 예약을 해요.
At the restaurant, we order different dishes and share them. | 식당에서는 여러 가지 음식을 시켜서 나눠 먹습니다.
We talk a lot while we eat. | 먹으면서 이야기를 많이 해요.
After the meal, we usually go to a café for dessert. | 식사 후에는 보통 카페에 가서 디저트를 먹습니다.
Eating out makes me happy. | 외식은 저를 행복하게 해요.`, 1),
Q('rest-past', 'past', '음식점', 'Tell me about a memorable meal you had at a restaurant. When was it, and what made it special?', '식당에서 했던 기억에 남는 식사에 대해 말해 주세요. 언제였고 왜 특별했나요?',
  ['언제, 누구와, 어떤 식당', '주문한 음식과 맛', '특별했던 순간과 소감'], `
Last month, I went to an Italian restaurant for my mother's birthday. | 지난달에 어머니 생신이라 이탈리안 레스토랑에 갔어요.
I made a reservation one week before. | 일주일 전에 예약했습니다.
The restaurant was quiet and beautiful. | 식당은 조용하고 예뻤어요.
We ordered pizza, pasta, and steak. | 피자, 파스타, 스테이크를 주문했습니다.
The food was really delicious. | 음식이 정말 맛있었어요.
After dinner, the staff brought a small cake and sang a birthday song. | 식사 후에 직원들이 작은 케이크를 가져와 생일 노래를 불러 줬습니다.
My mother was surprised and very happy. | 어머니는 놀라고 아주 기뻐하셨어요.
It was a little expensive, but it was a great dinner. | 조금 비쌌지만 멋진 저녁이었습니다.`, 1),

Q('rp-movie-ask', 'rp-ask', '영화 예매', "I'm going to give you a situation and ask you to act it out. You want to see a movie with your friend this weekend. Call the movie theater and ask three or four questions to get the information you need.", '상황을 드릴 테니 연기해 주세요. 이번 주말에 친구와 영화를 보고 싶습니다. 영화관에 전화해서 필요한 정보를 얻기 위해 질문을 서너 개 하세요.',
  ['인사 + 용건: I\'d like to ~', '질문 3~4개: 상영작, 시간, 가격, 예매', '감사 인사로 마무리'], `
Hello. I'd like to see a movie this weekend. | 안녕하세요. 이번 주말에 영화를 보고 싶은데요.
Can I ask you some questions? | 몇 가지 여쭤봐도 될까요?
First, what movies are playing this Saturday? | 먼저, 이번 토요일에 어떤 영화가 상영되나요?

    P('I work for ___.', '저는 ___에서 일해요.', 'I work for a trading company.', '저는 무역 회사에서 일해요.'),

    P('In my free time, I like to ___.', '여가 시간에는 ___하는 걸 좋아해요.', 'In my free time, I like to watch movies.', '여가 시간에는 영화 보는 걸 좋아해요.'),

    Z('오픽 본시험 시간은 얼마인가요?', ['약 20분', '약 40분', '약 60분', '약 90분'], 1, '오리엔테이션 약 20분 뒤에 본시험 40분이 이어져요.'),
    Z('난이도 3 이상을 고르면 몇 문항이 나오나요?', ['10문항', '12문항', '15문항', '20문항'], 2, '난이도 1~2는 12문항, 3 이상은 15문항이에요.'),

{ id: 2, title: '묘사하기', goal: '집, 카페, 공원을 현재시제 4~5문장으로 그려 내요.', min: 50,
  lessons: [
    { t: '묘사는 반드시 나와요', b: `<p>한 주제에서 문제가 세 개씩 묶여 나와요. 그 첫 문제가 대부분 묘사예요.</p><p class="en">Describe your home. / What does it look like?</p><p>묘사는 <b>현재시제</b>로 말해요. 시제를 바꿀 일이 없어서 가장 점수를 지키기 쉬운 유형이에요.</p>` },
    { t: '묘사 3단 뼈대', b: `<ul><li><b>한 줄 소개</b>: 무엇인지, 어디에 있는지</li><li><b>특징 세 가지</b>: 크기, 안에 있는 것, 분위기</li><li><b>내 느낌</b>: 좋아하는 이유</li></ul><p class="en">There is a café near my office. It is small, but it is quiet. I like it because I can relax there.</p>` },
    { t: '두 문장틀만 기억하세요', b: `<p><b>There is / There are</b>로 있는 것을 말하고, <b>It is + 형용사</b>로 어떤지 말해요.</p><p class="en">There is a sofa in the living room.<br>There are many trees in the park.<br>It is clean and cozy.</p><p>하나면 is, 여러 개면 are예요.</p>` },
    { t: '형용사 저금통', b: `<p>묘사에 바로 쓰는 형용사예요. 반대말끼리 묶어서 외우세요.</p><div class="tablebox"><table>
      <tr><td>big 큰</td><td>small 작은</td></tr><tr><td>quiet 조용한</td><td>crowded 붐비는</td></tr><tr><td>clean 깨끗한</td><td>cozy 아늑한</td></tr><tr><td>cheap 싼</td><td>expensive 비싼</td></tr><tr><td>comfortable 편한</td><td>convenient 편리한</td></tr></table></div>
      <p><b>not very ~, but ~</b>로 이으면 문장이 길어져요.</p>` }
  ],
  patterns: [
    P('There is a ___ in ___.', '___에 ___가 있어요.', 'There is a sofa in the living room.', '거실에 소파가 있어요.'),
    P('There are many ___.', '___가 많아요.', 'There are many trees and flowers.', '나무와 꽃이 많아요.'),
    P('It is ___ and ___.', '___하고 ___해요.', 'It is clean and cozy.', '깨끗하고 아늑해요.'),
    P('It is near ___.', '___ 근처에 있어요.', 'It is near my office.', '회사 근처에 있어요.'),
    P('It takes about ___ minutes on foot.', '걸어서 ___분 정도 걸려요.', 'It takes about five minutes on foot.', '걸어서 5분 정도 걸려요.'),
    P('It is not very ___, but it is ___.', '아주 ___하진 않지만 ___해요.', 'It is not very big, but it is clean.', '아주 크진 않지만 깨끗해요.'),
    P('My favorite ___ is ___.', '제가 가장 좋아하는 ___는 ___예요.', 'My favorite place is my room.', '제가 가장 좋아하는 곳은 제 방이에요.'),
    P('I like it because ___.', '___해서 좋아해요.', 'I like it because I can relax there.', '거기서 쉴 수 있어서 좋아해요.')
  ],
  models: ['home-desc', 'cafe-desc', 'park-desc'], practice: ['home-desc', 'cafe-desc', 'movie-desc', 'music-desc'],
  quiz: [
    Z('"거실에 소파가 있어요"를 바르게 말한 것은?', ['There are a sofa in the living room.', 'There is a sofa in the living room.', 'It has sofa in living room.', 'There have a sofa in the living room.'], 1, '하나일 때는 There is를 써요.'),
    Z('묘사 답변의 첫 문장으로 가장 좋은 것은?', ['I was happy.', 'I often go to a café near my office.', 'Thank you.', 'Because it is good.'], 1, '무엇을, 어디에 있는지 한 줄로 소개하며 시작해요.'),
    Z('빈칸에 알맞은 말은? "There ___ many trees in the park."', ['is', 'are', 'be', 'has'], 1, '여러 개일 때는 There are를 써요.'),
    Z('"아늑한"을 뜻하는 단어는?', ['crowded', 'cozy', 'cheap', 'convenient'], 1, 'cozy는 아늑한, crowded는 붐비는이에요.'),
    Z('묘사 답변의 마무리로 알맞은 것은?', ['I like it because I can relax there.', 'What time does it open?', 'I went there yesterday and.', 'There is.'], 0, '좋아하는 이유로 마무리하면 자연스러워요.')
  ] },

{ id: 3, title: '습관과 루틴 말하기', goal: '평소에 하는 일을 순서대로, 빈도 표현을 넣어 말해요.', min: 50,
  lessons: [
    { t: '루틴은 현재시제 + 빈도', b: `<p>묘사 다음에는 "보통 무엇을 하나요?"를 물어요.</p><p class="en">What do you usually do at the park?</p><p>평소 습관이니까 <b>현재시제</b>로 말하고, <b>얼마나 자주</b> 하는지를 꼭 넣으세요.</p>` },
    { t: '순서 뼈대', b: `<p>하는 일을 시간 순서로 늘어놓으면 답변이 길어져요.</p><p class="en">First, I ___. Then I ___. After that, I ___.</p><ul><li>언제, 누구와</li><li>하는 일 3~4개를 순서대로</li><li>좋은 점 한 문장</li></ul>` },
    { t: '빈도 표현의 자리', b: `<p>always, usually, often, sometimes는 <b>일반동사 앞</b>에 와요.</p><p class="en">I usually go to the park.<br>I always order an iced americano.</p><p>횟수는 문장 끝에 붙여요.</p><p class="en">I go to a café two or three times a week.</p>` },
    { t: '숫자를 넣으면 구체적이에요', b: `<p>시간과 횟수를 숫자로 말하면 답변이 구체적으로 들려요.</p><ul><li>for about an hour: 한 시간 정도</li><li>once a week: 일주일에 한 번</li><li>every morning: 매일 아침</li><li>on weekends: 주말마다</li></ul>` }
  ],
  patterns: [
    P('I usually ___ on weekends.', '주말에는 보통 ___해요.', 'I usually go to the park on weekends.', '주말에는 보통 공원에 가요.'),
    P('I ___ two or three times a week.', '일주일에 두세 번 ___해요.', 'I go to a café two or three times a week.', '일주일에 두세 번 카페에 가요.'),
    P('I go there with ___.', '___와 함께 거기에 가요.', 'I go there with my coworkers.', '동료들과 함께 거기에 가요.'),
    P('First, I ___. Then I ___.', '먼저 ___하고, 그 다음에 ___해요.', 'First, I order a drink. Then I sit down.', '먼저 음료를 주문하고, 그 다음에 자리에 앉아요.'),
    P('After that, I ___.', '그 후에 ___해요.', 'After that, I go home and take a shower.', '그 후에 집에 가서 샤워해요.'),
    P('While I ___, I ___.', '___하면서 ___해요.', 'While I walk, I listen to music.', '걸으면서 음악을 들어요.'),
    P('I stay there for about ___.', '거기서 ___ 정도 머물러요.', 'I stay there for about thirty minutes.', '거기서 30분 정도 머물러요.'),
    P('It helps me ___.', '___하는 데 도움이 돼요.', 'It helps me sleep well.', '잠을 잘 자는 데 도움이 돼요.')
  ],
  models: ['cafe-routine', 'movie-routine', 'park-routine'], practice: ['home-routine', 'music-routine', 'trip-routine', 'cafe-routine'],
  quiz: [
    Z('빈도부사의 위치가 바른 문장은?', ['I go usually to the park.', 'I usually go to the park.', 'Usually go I to the park.', 'I go to usually the park.'], 1, 'usually는 일반동사 go 앞에 와요.'),
    Z('"일주일에 두세 번"을 영어로 하면?', ['two or three times a week', 'two three time week', 'a week two or three', 'in two or three weeks'], 0, '횟수 + a week 순서예요.'),
    Z('순서를 나타내는 말이 아닌 것은?', ['First', 'Then', 'After that', 'Because'], 3, 'Because는 이유를 말할 때 써요.'),
    Z('루틴 답변의 기본 시제는?', ['현재시제', '과거시제', '미래시제', '현재완료'], 0, '평소 습관은 현재시제로 말해요.'),
    Z('"걸으면서 음악을 들어요"를 영어로 하면?', ['While I walk, I listen to music.', 'I walk because music.', 'I walked and listened music.', 'Walk while listen music.'], 0, 'While I ~, I ~ 로 두 동작을 이어요.')
  ] },

{ id: 4, title: '과거 경험 말하기', goal: '과거시제로 "언제, 무슨 일, 기분"을 이야기해요.', min: 60,
  lessons: [
    { t: '과거시제가 등급을 가릅니다', b: `<p>묶음 문제의 세 번째는 대부분 경험이에요.</p><p class="en">Tell me about a memorable trip you took.</p><p>여기서 <b>과거형 동사</b>를 쓰느냐가 IM으로 가는 문이에요. 틀려도 괜찮으니 went, was, had를 입에 붙이세요.</p>` },
    { t: '경험 4단 뼈대', b: `<ul><li><b>언제, 어디서, 누구와</b>: Last month, I went to ~ with ~.</li><li><b>무슨 일</b>: 2~3문장</li><li><b>기분</b>: I was so ~.</li><li><b>마무리</b>: I still remember it.</li></ul><p>사건이 생각나지 않으면 평범한 일을 과거형으로 말해도 돼요.</p>` },
    { t: '꼭 외울 과거형 12개', b: `<div class="tablebox"><table>
      <tr><td>go → <b>went</b></td><td>have → <b>had</b></td><td>eat → <b>ate</b></td></tr>
      <tr><td>see → <b>saw</b></td><td>take → <b>took</b></td><td>buy → <b>bought</b></td></tr>
      <tr><td>get → <b>got</b></td><td>make → <b>made</b></td><td>come → <b>came</b></td></tr>
      <tr><td>feel → <b>felt</b></td><td>meet → <b>met</b></td><td>tell → <b>told</b></td></tr></table></div>
      <p>나머지는 대부분 -ed를 붙여요. visited, watched, ordered.</p>` },
    { t: '감정 한마디', b: `<p>경험 답변에는 기분을 꼭 한 문장 넣으세요.</p><ul><li>I was so <b>happy</b>. 정말 기뻤어요.</li><li>I was <b>surprised</b>. 놀랐어요.</li><li>I was <b>disappointed</b>. 실망했어요.</li><li>I was <b>upset</b>. 속상했어요.</li><li>I was <b>relieved</b>. 안심했어요.</li></ul>` }
  ],
  patterns: [
    P('Last ___, I went to ___ with ___.', '지난 ___에 ___와 ___에 갔어요.', 'Last spring, I went to the park with my family.', '지난봄에 가족과 공원에 갔어요.'),
    P('___ years ago, I ___.', '___년 전에 ___했어요.', 'Two years ago, I went to Busan.', '2년 전에 부산에 갔어요.'),
    P('It was ___.', '___였어요.', 'It was a rainy day.', '비 오는 날이었어요.'),
    P('I was so ___.', '정말 ___했어요. (기분)', 'I was so happy.', '정말 기뻤어요.'),
    P('Suddenly, ___.', '갑자기 ___했어요.', 'Suddenly, it started to rain.', '갑자기 비가 내리기 시작했어요.'),
    P('So I ___.', '그래서 ___했어요.', 'So I called the office right away.', '그래서 바로 사무실에 전화했어요.'),
    P('After that, I ___.', '그 후에 ___했어요.', 'After that, I bought a phone case.', '그 후에 휴대폰 케이스를 샀어요.'),
    P('I still remember it.', '아직도 기억나요.', 'It was a funny day, so I still remember it.', '재미있는 날이어서 아직도 기억나요.')
  ],
  models: ['trip-past', 'cafe-past', 'park-past'], practice: ['movie-past', 'home-past', 'music-past', 'trip-past'],
  quiz: [
    Z('go의 과거형은?', ['goed', 'gone', 'went', 'going'], 2, 'go – went. 가장 많이 쓰는 과거형이에요.'),
    Z('"2년 전에"를 영어로 하면?', ['two years ago', 'before two year', 'ago two years', 'in two years'], 0, '기간 + ago 순서예요.'),
    Z('경험 답변에 꼭 넣으면 좋은 것은?', ['어려운 단어', '기분을 말하는 문장', '질문 세 개', '미래 계획'], 1, 'I was so happy. 같은 감정 문장이 답변을 살려요.'),
    Z('바른 문장은?', ['I buy a new phone last year.', 'I buyed a new phone last year.', 'I bought a new phone last year.', 'I was buy a new phone last year.'], 2, 'buy – bought. last year가 있으니 과거형이에요.'),
    Z('"안심했어요"를 영어로 하면?', ['I was upset.', 'I was relieved.', 'I was disappointed.', 'I was surprised.'], 1, 'relieved는 안심한, upset은 속상한이에요.')
  ] },

{ id: 5, title: '롤플레이', goal: '전화로 물어보고, 문제를 설명하고, 대안을 제시해요.', min: 60,
  lessons: [
    { t: '11~13번은 상황극이에요', b: `<p>세 문제가 한 상황으로 이어져요.</p><ul><li><b>11번</b>: 전화하거나 찾아가서 <b>질문 3~4개</b> 하기</li><li><b>12번</b>: 문제가 생겼어요. <b>상황 설명 + 대안 2~3개</b></li><li><b>13번</b>: 비슷한 일을 겪은 <b>내 경험</b> (Day 4 뼈대 그대로)</li></ul><p>실제 통화처럼 Hello. 로 시작하면 연기가 쉬워져요.</p>` },
    { t: '질문하기 공식', b: `<p class="en">Hello. I'd like to ___. Can I ask you some questions?</p><p>그다음 질문 틀에 단어만 바꿔 넣어요.</p><ul><li>What time does ___ start?</li><li>How much is ___?</li><li>Do you have ___?</li><li>Can I ___?</li></ul><p>마지막은 Thank you for your help.</p>` },
    { t: '문제 해결 공식', b: `<ul><li><b>문제 알리기</b>: I have a problem with ___.</li><li><b>상황 설명</b>: 무엇이 잘못됐는지 2문장</li><li><b>대안 두 개</b>: Can I ___? Or can I ___?</li><li><b>부탁</b>: Please help me.</li></ul><p>대안은 <b>바꾸기, 환불받기, 다른 날로 옮기기</b> 세 가지를 돌려 쓰면 돼요.</p>` },
    { t: '15번은 면접관에게 질문', b: `<p>난이도 3~4에서는 마지막에 면접관이 자기 이야기를 한 줄 하고 질문해 달라고 해요.</p><p class="en">I also enjoy listening to music. Ask me three or four questions.</p><p>반응 한마디 뒤에 <b>What / When / Who / How often</b> 질문을 세 개 이상 하세요.</p>` }
  ],
  patterns: [
    P("I'd like to ___.", '___하고 싶은데요.', "I'd like to book a room.", '방을 예약하고 싶은데요.'),
    P('Can I ask you some questions?', '몇 가지 여쭤봐도 될까요?', 'Hello. Can I ask you some questions?', '안녕하세요. 몇 가지 여쭤봐도 될까요?'),
    P('What time does ___ start?', '___는 몇 시에 시작하나요?', 'What time does the movie start?', '영화는 몇 시에 시작하나요?'),
    P('How much is ___?', '___는 얼마인가요?', 'How much is a ticket?', '표는 얼마인가요?'),
    P('Do you have ___?', '___가 있나요?', 'Do you have this jacket in black?', '이 재킷 검은색이 있나요?'),
    P('I have a problem with ___.', '___에 문제가 있어요.', 'I have a problem with my tickets.', '제 표에 문제가 있어요.'),
    P('Can I change it to ___?', '___로 바꿀 수 있을까요?', "Can I change it to seven o'clock?", '7시로 바꿀 수 있을까요?'),
    P('Can I get a refund?', '환불받을 수 있을까요?', 'Or can I get a refund?', '아니면 환불받을 수 있을까요?'),
    P('Could you ___?', '___해 주실 수 있나요?', 'Could you send someone to fix it?', '고쳐 줄 분을 보내 주실 수 있나요?'),
    P('Thank you for your help.', '도와주셔서 감사합니다.', 'Okay, I see. Thank you for your help.', '네, 알겠습니다. 도와주셔서 감사합니다.')
  ],

/* ---------- 음성: 듣기(TTS) · 받아쓰기(STT) · AI 첨삭 ----------
   claude.ai 아티팩트 안에서는 플랫폼 기능을, 그 밖에서는 브라우저의 Web Speech API를 씁니다. */

  tts: null, dict: null, ai: null, srDead: false,
  init() {

  },
  halt() {

  },
  speak(text) {

async function playSeq(list, onStep) {

const Rec = {

/* ---------- 답변 분석 ---------- */
const CONN = ['and', 'but', 'so', 'because', 'also', 'then', 'when', 'first', 'second', 'after that', 'before', 'while', 'or', 'however', 'for example', 'actually', 'if', 'too', 'finally', 'these days', 'anyway', "that's why"];
function analyze(text, secs, q, stt) {

  const fill = count(/ (um+|uh+|er+|erm|hmm+|ah+)(?= )/g, flat);
  const past = count(/ (was|were|went|had|did|didn't|saw|ate|took|got|made|came|felt|bought|met|told|gave|found|lost|said|ran|swam|couldn't|wasn't|left|paid|sent|broke|[a-z]{2,}ed)(?= )/g, flat);
  const ques = Math.max(count(/\?/g, text), count(/ (what|where|when|who|how|which|why|do you|does it|is there|are there|is it|can i|can you|could you|could i)(?= )/g, flat));

  if (T === 'intro') {
    n = [/ (my name is|i am|i'm) /, / live /, / (work|student|job|company|school|worker) /, / (like|enjoy|love|hobby|free time) /].filter(r => r.test(flat)).length;
    task = n / 4; tk = '자기소개 요소'; tv = n + ' / 4개'; tt = '이름, 사는 곳, 하는 일, 취미를 모두 넣어 보세요.';
  } else if (T === 'desc') {
    n = count(/ (there is|there are|it is|it's|they are|it has|i have)(?= )/g, flat);
    task = Math.min(n / 3, 1); tk = '묘사 문장'; tv = n + '개'; tt = 'There is/are, It is + 형용사 문장을 3개 이상 넣어 보세요.';
  } else if (T === 'routine') {

    task = Math.min(n / 3, 1); tk = '빈도 · 순서 표현'; tv = n + '개'; tt = 'usually, first, then, after that 같은 표현을 3개 이상 써 보세요.';
  } else if (T === 'past' || T === 'rp-exp') {
    task = Math.min(past / 4, 1); tk = '과거시제'; tv = past + '개'; tt = 'went, was, had처럼 과거형 동사를 4개 이상 써 보세요.';
  } else if (T === 'rp-ask' || T === 'ava') {
    task = Math.min(ques / 3, 1); tk = '질문 개수'; tv = ques + '개'; tt = '질문을 3개 이상 해야 해요. What, How much, Can I 로 시작해 보세요.';
  } else {
    const prob = / (problem|mistake|wrong|doesn't work|broken|not clean|hole) /.test(flat);

    { k: '발화량', v: wc + '단어 · 약 ' + sents + '문장', st: st(wc, 60, 35), tip: 'IM1 목표는 60단어, 6문장 이상이에요. 뼈대의 세 덩어리를 모두 말해 보세요.' },
    wpm == null ? { k: '말하기 속도', v: '측정하지 않음', st: 'good', tip: '' }

    { k: '연결어', v: conn.length ? conn.length + '종 (' + conn.slice(0, 4).join(', ') + ')' : '없음', st: st(conn.length, 4, 2), tip: 'and, but, so, because 로 문장을 이으면 답변이 자연스러워져요.' },
    { k: tk, v: tv, st: st(task, 0.99, 0.5), tip: tt },

function stepView(d) {

  if (step === 'lesson') {

const MOCK_SECS = 40 * 60;
function buildMock() {
  const by = (t, ty) => D.QUESTIONS.find(q => q.topic === t && q.type === ty);
  const topics = x => shuffle([...new Set(D.QUESTIONS.filter(q => q.type === 'desc' && q.unexp === x).map(q => q.topic))]);
  const sv = topics(false), un = topics(true), rp = shuffle([...new Set(D.QUESTIONS.filter(q => q.type === 'rp-ask').map(q => q.topic))]);
  const combo = t => ['desc', 'routine', 'past'].map(ty => by(t, ty).id);
  const ava = shuffle(D.QUESTIONS.filter(q => q.type === 'ava'))[0];
  return ['intro-1'].concat(combo(sv[0]), combo(sv[1]), combo(un[0]), ['rp-ask', 'rp-solve', 'rp-exp'].map(ty => by(rp[0], ty).id), [by(sv[2], 'desc').id, ava.id]);
}

      work ? (/student/i.test(job) ? 'I go to ' : 'I work for ') + work + '.' : '', 'In my free time, I like to ' + h1 + (h2 ? ' and ' + h2 : '') + '.', 'I am ' + v('ibChar', 'a quiet') + ' person.', "That's all about me. Thank you."];
    putScript(s.filter(Boolean).join(' '));
  },
  'ai-coach': aiCoach,
  'quiz-pick'(el) { const d = D.DAYS[V.day - 1], z = d.quiz[QZ.i]; if (QZ.picked != null) return; QZ.picked = +el.dataset.i; if (QZ.picked === z.a) QZ.ok++; render(); },
  'quiz-next'() { const d = D.DAYS[V.day - 1]; QZ.i++; QZ.picked = null; if (QZ.i >= d.quiz.length) markStep(d.id, 'quiz', QZ.ok); render(); $('#main').scrollTop = 0; },
  'mock-start'() { M = { items: buildMock(), i: 0, t0: Date.now(), ans: [], replay: 1, played: false, phase: 'ready', cur: null }; clearInterval(mockTick); mockTick = setInterval(mockClock, 1000); go({ tab: 'mock' }); mockPlay(); },
  'mock-play': mockPlay,
  'mock-next': mockNext,
  'mock-quit'(el) { if (!armed(el, '한 번 더 누르면 기록 없이 끝나요')) return; clearInterval(mockTick); if (Rec.active) Rec.cancel(); M = null; go({ tab: 'mock' }); },
  'mock-result'(el) { go({ tab: 'mock', result: +el.dataset.i }); },
  sec(el) { go({ tab: 'review', sec: el.dataset.sec }); },
  'card-show'() { CQ.show = true; render(); },
  'card-good'() { const id = CQ.queue.shift(), c = S.cards[id]; if (c) { c.due = addDays(today(), [1, 2, 4, 7, 14][Math.min(c.box, 5) - 1]); c.box = Math.min(5, c.box + 1); } CQ.show = false; touch(); save(); render(); },
  'card-again'() { const id = CQ.queue.shift(), c = S.cards[id]; if (c) { c.box = 1; c.due = today(); } CQ.queue.push(id); CQ.show = false; save(); render(); },
  'card-all'() { CQ = { queue: shuffle(Object.keys(S.cards).filter(id => PMAP[id])), show: false }; render(); },
  'script-del'(el) { if (!armed(el, '한 번 더 누르면 삭제')) return; delete S.scripts[el.dataset.q]; save(); render(); },
  reset(el) { if (!armed(el, '한 번 더 누르면 모두 지워져요')) return; try { localStorage.removeItem(KEY); } catch (e) {} S = blank(); OB = { step: 0, name: '', job: 'worker', date: '' }; CQ = null; M = null; clearInterval(mockTick); V = { tab: 'today' }; render(); $('#main').scrollTop = 0; }
};
document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (!el || el.disabled) return; const fn = ACT[el.dataset.act]; if (fn) fn(el, e); });
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'setRate') { S.settings.rate = +t.value; const o = $('#rateOut'); if (o) o.textContent = (+t.value).toFixed(2); save(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'setShowText') { S.settings.showText = t.checked; save(); }
  else if (t.id === 'setName') { S.profile.name = t.value.trim(); save(); }
  else if (t.id === 'setDate') { S.profile.examDate = t.value; save(); setTop('복습', '카드 · 스크립트 · 기록', false); }
  else if (t.id === 'obDate') OB.date = t.value;
});
window.addEventListener('hashchange', () => { const t = location.hash.slice(1); if (S.onboarded && TABS.includes(t) && t !== V.tab) go({ tab: t }); });
window.addEventListener('pagehide', () => { Voice.halt(); if (Rec.active) Rec.cancel(); });

const h0 = location.hash.slice(1);
V = { tab: TABS.includes(h0) ? h0 : 'today' };
Voice.init();
render();
})();
</script>
</body>
