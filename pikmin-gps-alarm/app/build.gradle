plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sizzly.pikmingps'
    compileSdk 35

    defaultConfig {
        applicationId 'com.sizzly.pikmingps'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        // 고정 키로 서명해야 새 버전을 지우지 않고 덮어서 설치할 수 있음
        fixed {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.fixed
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.fixed
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
